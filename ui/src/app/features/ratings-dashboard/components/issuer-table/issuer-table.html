<table mat-table [dataSource]="issuers()" class="mat-elevation-z8">
  <ng-container matColumnDef="issuerName">
    <th mat-header-cell *matHeaderCellDef>Issuer name</th>
    <td mat-cell *matCellDef="let element">{{element.issuerName}}</td>
  </ng-container>
  <ng-container matColumnDef="industry">
    <th mat-header-cell *matHeaderCellDef>Industry</th>
    <td mat-cell *matCellDef="let element">{{element.industry}}</td>
  </ng-container>
  <ng-container matColumnDef="rating">
    <th mat-header-cell *matHeaderCellDef>Rating</th>
    <td mat-cell *matCellDef="let element">{{element.rating}}</td>
  </ng-container>

  <ng-container matColumnDef="outlook">
    <th mat-header-cell *matHeaderCellDef>Outlook</th>
    <td mat-cell *matCellDef="let element">{{element.outlook}}</td>
  </ng-container>

  <ng-container matColumnDef="lastUpdatedDate">
    <th mat-header-cell *matHeaderCellDef>Last updated</th>
    <td mat-cell *matCellDef="let element">{{element.lastUpdatedDate}}</td>
  </ng-container>

  <ng-container matColumnDef="open">
    <th mat-header-cell *matHeaderCellDef>Open Details</th>
    <td mat-cell *matCellDef="let element">
      <mat-icon (click)="openDetails(element)" class="open-icon"
        >open_in_new</mat-icon
      >
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <tr *matNoDataRow>
    <td [attr.colspan]="displayedColumns.length" class="no-data">
      No data found
    </td>
  </tr>
</table>
